server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端容器服务名固定为 qps-api；启动时需能解析该主机名。
    location /api/ {
        proxy_pass http://qps-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台上传目录由后端 wwwroot/uploads 提供，同源反代后前端存的相对路径可直接访问。
    location /uploads/ {
        proxy_pass http://qps-api:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 产物带内容哈希，可长期强缓存。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 入口页不缓存，避免发版后仍命中旧 HTML。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # hash 路由本身只需 index.html，try_files 作为兜底保险。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
