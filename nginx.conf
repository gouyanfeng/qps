server {
    listen 80;

    # 前端：所有普通请求
    location / {
        proxy_pass http://qps-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端 API：/api 开头的请求转发给后端
    location ~* ^/api/ {
        proxy_pass http://qps-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 本地存储模式的图片：由 api 的 wwwroot 直出（带一年 immutable 缓存）。
    # 切到 OSS 后前端直接访问 Bucket 域名，不再经过这里，保留作为兜底。
    location /uploads/ {
        proxy_pass http://qps-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 移动端 H5：转发时剥掉 /h5/ 前缀（proxy_pass 末尾带 / 即替换 location 前缀），
    # mobile 容器按根路径托管产物；vite base 保持默认 /。
    location /h5/ {
        proxy_pass http://qps-mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /h5（无斜杠）301 到 /h5/，避免相对路径解析错位
    location = /h5 {
        return 301 /h5/;
    }
}
