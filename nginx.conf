server {
    listen 80;

    # 前端：所有普通请求
    location / {
        proxy_pass http://qps-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端 API：/api 开头的请求转发给后端
    location ~* ^/api/ {
        proxy_pass http://qps-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
