# ============================================================================
# QPS nginx 网关：按域名分发到对应容器（与 docker-compose.yml 的 gateway 服务配套）
# - admin.yf365.top -> admin:80（管理端静态站）
# - h5.yf365.top    -> mobile:80（移动端 H5 静态站）
# - api.yf365.top   -> qps-api:5000（后端 API，含 SignalR WebSocket）
# 未匹配域名/IP 直访一律落到 admin（过渡期保留，收紧时可改为 return 444）
# ============================================================================

# WebSocket 升级头统一映射：普通请求不带 Upgrade 时置 close，避免长连接被误降级
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 管理端
server {
    listen 80;
    server_name admin.yf365.top;

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 移动端 H5
server {
    listen 80;
    server_name h5.yf365.top;

    location / {
        proxy_pass http://mobile:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 后端 API
server {
    listen 80;
    server_name api.yf365.top;

    # 附件/图片上传上限；后端如有独立限制以 Kestrel FormOptions 为准
    client_max_body_size 50m;

    location / {
        proxy_pass http://qps-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR /hubs 与 jobs-dashboard 的 WebSocket：网关必须透传升级头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接空闲超时：SignalR 心跳 15s 一次，5 分钟足够宽裕
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 兜底：IP 直访或未配置的域名 -> admin（保持旧行为可用）
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
