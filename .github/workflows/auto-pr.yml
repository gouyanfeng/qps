name: Auto PR dev to master

on:
  push:
    branches: [ "dev" ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --head dev --base master --state open --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "Open PR already exists, skipping"
          else
            gh pr create \
              --base master \
              --head dev \
              --title "dev to master" \
              --body "Automated PR from dev to master."
          fi
