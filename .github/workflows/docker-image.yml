name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write      # 推送 GHCR 必须，缺了会 denied: permission_denied

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 命名空间必须全小写
      - name: Normalize owner to lowercase
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # 仅在 push 到 master 时登录；dev 推送不触发本 workflow。
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 构建 qps-api 与 admin（gateway 无 build，compose 会自动跳过）
      - name: Build images
        run: docker compose --env-file .env --file ./docker-compose.yml build

      # 只推需要构建的两个服务，gateway 是 nginx 官方镜像，不推
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for svc in qps-api qps-admin; do
            docker push "${REGISTRY}/${IMAGE_OWNER}/${svc}:${IMAGE_TAG}"
          done

      # 发布分支额外覆盖 latest：compose 的 IMAGE_TAG 默认值就是 latest，
      # 服务器不注入 IMAGE_TAG 时也能拉到镜像；可精确回滚的引用仍以 sha tag 为准。
      - name: Tag and push latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for service in qps-api qps-admin; do
            source_image="${REGISTRY}/${IMAGE_OWNER}/${service}:${IMAGE_TAG}"
            latest_image="${REGISTRY}/${IMAGE_OWNER}/${service}:latest"
            docker tag "$source_image" "$latest_image"
            docker push "$latest_image"
          done
