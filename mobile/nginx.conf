server {
    listen 80;
    server_name _;

    # 必须显式指定 root：nginx 的默认 root 是相对编译前缀的 "html"（即 /etc/nginx/html），
    # 不写这一行 try_files 兜底到 /index.html 时会找不到文件，内部重定向自我循环 → 500。
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不缓存，避免发版后仍命中旧 HTML。
    location ~* ^/index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # uni-app H5 为 hash 路由，只需静态托管 + index.html 兜底，按根路径处理。
    # API 不在此反代：前端直连 http://<server>:5000（后端 CORS 已全开）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
