services:
  qps-api:
    build:
      context: ./web-api
      dockerfile: Dockerfile
    image: qps-api:local
    container_name: qps-api
    # 仅内部网络访问；对外统一由 gateway 反向代理。
    expose:
      - "5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
      # 数据库沿用主机上现有的 SQL Server；值取自 web-api/src/QPS.Host/appsettings.json。
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=QPS_CRM;User Id=sa;Password=123456;TrustServerCertificate=True;Encrypt=False;"
      Jwt__SecretKey: "ThisIsASecretKeyThatIsAtLeast32CharactersLong"
      Jwt__Issuer: "QPS.API"
      Jwt__Audience: "QPS.Client"
    # Linux 容器访问宿主机服务需要显式声明 host.docker.internal。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qps-uploads:/app/wwwroot
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/swagger/v1/swagger.json || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    image: qps-admin:local
    container_name: qps-admin
    environment:
      TZ: Asia/Shanghai
    # 仅内部网络访问；对外统一由 gateway 反向代理。
    expose:
      - "80"
    depends_on:
      qps-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 统一入口：宿主 80 被系统进程占用，改用 8000。
  gateway:
    image: nginx:alpine-slim
    container_name: qps-gateway
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      qps-api:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/favicon.svg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qps-uploads:
