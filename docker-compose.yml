services:
  # nginx 网关：按域名分发（admin.yf365.top / h5.yf365.top / api.yf365.top），
  # 80 端口统一入口；443/TLS 后续加证书时在 gateway.conf 增补 server 块。
  # 各业务容器仍保留直连端口便于调试，收口后可删除对应 ports。
  # 命名约定：服务名 = 容器名，统一 qps- 前缀（容器名宿主机全局唯一，防与其他项目撞车）。
  qps-gateway:
    image: nginx:alpine-slim
    container_name: qps-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      qps-admin:
        condition: service_healthy
      qps-mobile:
        condition: service_healthy
      qps-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  qps-api:
    build:
      context: ./web-api
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-api:${IMAGE_TAG:-latest}
    container_name: qps-api
    # 直接暴露到宿主机 5000，供调试/直连；前端实际走各自容器的 /api 反代（同源）。
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
      # 数据库沿用主机上现有的 SQL Server；值来自仓库根目录 .env（模板见 .env.example）。
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=True;Encrypt=False;"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      # 文件存储：local 写 wwwroot（数据卷），oss 直传阿里云 OSS；两者返回同一套 /uploads/... 相对地址。
      Storage__Provider: "${STORAGE_PROVIDER:-local}"
      Storage__Oss__Endpoint: "${OSS_ENDPOINT:-}"
      Storage__Oss__BucketName: "${OSS_BUCKET:-}"
      Storage__Oss__AccessKeyId: "${OSS_ACCESS_KEY_ID:-}"
      Storage__Oss__AccessKeySecret: "${OSS_ACCESS_KEY_SECRET:-}"
      Storage__Oss__ObjectAcl: "${OSS_OBJECT_ACL:-public-read}"
    # Linux 容器访问宿主机服务需要显式声明 host.docker.internal。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qps-uploads:/app/wwwroot
    restart: "no"
    healthcheck:
      # 探匿名落地页：不经过鉴权、不依赖数据库，Swagger 已移除后不能再作为探针。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  qps-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # 前端直连后端（后端 CORS 全开，不做反代）：API 站点根（不含 /api 后缀）在 .env 配置，
        # 两个前端共用 VITE_API_BASE_URL，/api 前缀由各自项目代码拼接。
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-admin:${IMAGE_TAG:-latest}
    container_name: qps-admin
    environment:
      TZ: Asia/Shanghai
    # 直接暴露宿主机 5173；纯静态托管，API 由前端直连 5000。
    ports:
      - "5173:80"
    depends_on:
      qps-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 移动端 H5：直接暴露宿主机 5174，按根路径托管纯静态站点；API 由前端直连 5000。
  qps-mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        # API 站点根（不含 /api 后缀），与 admin 共用同一变量；mobile 请求路径自带 /api。
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-mobile:${IMAGE_TAG:-latest}
    container_name: qps-mobile
    environment:
      TZ: Asia/Shanghai
    # 直接暴露宿主机 5174；容器内 nginx 同时反代 /api、/uploads 到 qps-api（同源免跨域）。
    ports:
      - "5174:80"
    depends_on:
      qps-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qps-uploads: