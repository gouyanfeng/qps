services:
  qps-api:
    build:
      context: ./web-api
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-api:${IMAGE_TAG:-latest}
    container_name: qps-api
    # 仅内部网络访问；对外统一由 gateway 反向代理。
    expose:
      - "5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
      # 数据库沿用主机上现有的 SQL Server；值来自仓库根目录 .env（模板见 .env.example）。
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=True;Encrypt=False;"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      # 文件存储：local 写 wwwroot（数据卷），oss 直传阿里云 OSS；两者返回同一套 /uploads/... 相对地址。
      Storage__Provider: "${STORAGE_PROVIDER:-local}"
      Storage__Oss__Endpoint: "${OSS_ENDPOINT:-}"
      Storage__Oss__BucketName: "${OSS_BUCKET:-}"
      Storage__Oss__AccessKeyId: "${OSS_ACCESS_KEY_ID:-}"
      Storage__Oss__AccessKeySecret: "${OSS_ACCESS_KEY_SECRET:-}"
    # Linux 容器访问宿主机服务需要显式声明 host.docker.internal。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qps-uploads:/app/wwwroot
    restart: "no"
    healthcheck:
      # 探匿名落地页：不经过鉴权、不依赖数据库，Swagger 已移除后不能再作为探针。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-admin:${IMAGE_TAG:-latest}
    container_name: qps-admin
    environment:
      TZ: Asia/Shanghai
    # 仅内部网络访问；对外统一由 gateway 反向代理。
    expose:
      - "80"
    depends_on:
      qps-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 移动端 H5：网关转发 /h5/* 时剥前缀，容器内按根路径托管；API 走同源相对路径由 gateway 转发。
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/qps-mobile:${IMAGE_TAG:-latest}
    container_name: qps-mobile
    environment:
      TZ: Asia/Shanghai
    # 仅内部网络访问；对外统一由 gateway 反向代理。
    expose:
      - "80"
    depends_on:
      qps-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 统一入口：直接占用宿主 80 端口（如与宿主机其他服务冲突，可用 GATEWAY_PORT 覆盖）。
  # gateway 使用官方镜像，不参与构建与推送。
  gateway:
    image: nginx:alpine-slim
    container_name: qps-gateway
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      qps-api:
        condition: service_healthy
      admin:
        condition: service_healthy
      mobile:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/favicon.svg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qps-uploads: